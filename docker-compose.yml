services:
  api:
    build:
      context: .
    init: true
    ports:
      - "${RIGOROUSRAG_BIND_ADDRESS:-127.0.0.1}:${RIGOROUSRAG_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-gpt-4o}
      RETRIEVAL_EXPANSION_MODEL: ${RETRIEVAL_EXPANSION_MODEL:-}
      MAX_RESPONSE_TOKENS: ${MAX_RESPONSE_TOKENS:-2000}
      MAX_TOOL_ARGUMENT_CHARS: ${MAX_TOOL_ARGUMENT_CHARS:-50000}
      MAX_TOOL_RESULT_CHARS: ${MAX_TOOL_RESULT_CHARS:-30000}
      MAX_EVIDENCE_SOURCES: ${MAX_EVIDENCE_SOURCES:-100}
      MAX_CONCURRENT_TOOL_WORKERS: ${MAX_CONCURRENT_TOOL_WORKERS:-32}
      MAX_PENDING_TOOL_TASKS: ${MAX_PENDING_TOOL_TASKS:-64}
      LEGACY_LLM_TIMEOUT_SECONDS: ${LEGACY_LLM_TIMEOUT_SECONDS:-60}
      QUERY_WORKERS: ${QUERY_WORKERS:-8}
      QUERY_MAX_PENDING: ${QUERY_MAX_PENDING:-32}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-120}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_MAX_RESPONSE_BYTES: ${SERPER_MAX_RESPONSE_BYTES:-2000000}
      WEB_SEARCH_MAX_RESULT_CANDIDATES: ${WEB_SEARCH_MAX_RESULT_CANDIDATES:-30}
      API_KEY_OWNERS_JSON: ${API_KEY_OWNERS_JSON:-}
      SINGLE_USER_OWNER_ID: ${SINGLE_USER_OWNER_ID:-default_user}
      RETAIN_SOURCE_FILES: ${RETAIN_SOURCE_FILES:-true}
      ORPHAN_CLEANUP_ON_STARTUP: ${ORPHAN_CLEANUP_ON_STARTUP:-true}
      ORPHAN_GRACE_SECONDS: ${ORPHAN_GRACE_SECONDS:-3600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-50000000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-51048576}
      INGEST_WORKERS: ${INGEST_WORKERS:-2}
      INGEST_MAX_PENDING: ${INGEST_MAX_PENDING:-64}
      INGEST_ADMISSION_RETRY_SECONDS: ${INGEST_ADMISSION_RETRY_SECONDS:-1}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
      INGEST_RETRY_BASE_SECONDS: ${INGEST_RETRY_BASE_SECONDS:-2}
      INGEST_RETRY_MAX_SECONDS: ${INGEST_RETRY_MAX_SECONDS:-30}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-86400}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-2000}
      MAX_PDF_RENDER_PIXELS: ${MAX_PDF_RENDER_PIXELS:-40000000}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-5000000}
      MAX_DOCX_MEMBERS: ${MAX_DOCX_MEMBERS:-10000}
      MAX_DOCX_UNCOMPRESSED_BYTES: ${MAX_DOCX_UNCOMPRESSED_BYTES:-200000000}
      MAX_DOCX_COMPRESSION_RATIO: ${MAX_DOCX_COMPRESSION_RATIO:-1000}
      VISUAL_MAX_PDF_PAGES: ${VISUAL_MAX_PDF_PAGES:-500}
      VISUAL_MAX_RENDER_PIXELS: ${VISUAL_MAX_RENDER_PIXELS:-2000000}
      VISUAL_MAX_ENCODED_BYTES: ${VISUAL_MAX_ENCODED_BYTES:-10000000}
      ENABLE_OCR: ${ENABLE_OCR:-false}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
      OCR_DPI: ${OCR_DPI:-200}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-30}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-40}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-10000}
      DOCUMENT_LIST_SCAN_BATCH: ${DOCUMENT_LIST_SCAN_BATCH:-500}
      MAX_DOCUMENT_LIST_SCAN_CHUNKS: ${MAX_DOCUMENT_LIST_SCAN_CHUNKS:-100000}
      CLASSIC_STORAGE_DIR: /app/data
      CLASSIC_MAX_SNAPSHOT_FILE_BYTES: ${CLASSIC_MAX_SNAPSHOT_FILE_BYTES:-250000000}
      HANDBOOK_MAX_BYTES: ${HANDBOOK_MAX_BYTES:-1000000}
      HANDBOOK_MAX_CHUNKS: ${HANDBOOK_MAX_CHUNKS:-1000}
      MAX_REMOTE_DOWNLOAD_BYTES: ${MAX_REMOTE_DOWNLOAD_BYTES:-5000000}
      REMOTE_REQUEST_TIMEOUT_SECONDS: ${REMOTE_REQUEST_TIMEOUT_SECONDS:-15}
      MAX_REMOTE_REDIRECTS: ${MAX_REMOTE_REDIRECTS:-4}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-60}
      USAGE_LOG_FILE: /app/data/usage_metrics.jsonl
      USAGE_LOG_MAX_BYTES: ${USAGE_LOG_MAX_BYTES:-10485760}
      USAGE_LOG_BACKUPS: ${USAGE_LOG_BACKUPS:-3}
      HEALTHCHECK_URL: http://127.0.0.1:8000/health
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-3}
      CHROMA_PATH: /app/rag_storage
      UPLOAD_DIR: /app/uploads
      JOB_DB_PATH: /app/data/jobs.sqlite3
      DOCUMENT_DB_PATH: /app/data/documents.sqlite3
    volumes:
      - rigorousrag_uploads:/app/uploads
      - rigorousrag_vectors:/app/rag_storage
      - rigorousrag_crawl:/app/data
      - rigorousrag_cache:/home/rigorousrag/.cache
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  rigorousrag_uploads:
  rigorousrag_vectors:
  rigorousrag_crawl:
  rigorousrag_cache:
