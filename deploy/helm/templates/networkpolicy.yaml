{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rigorousrag.fullname" . }}
  labels:
    {{- include "rigorousrag.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rigorousrag.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
