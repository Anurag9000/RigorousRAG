name: Training surface census

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.ipynb"
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.zsh"
      - "**/*.ps1"
      - "**/*.r"
      - "**/*.jl"
      - "pyproject.toml"
      - ".github/workflows/training-surface-census.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-surface-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile census engine
        run: python -m py_compile tools/training_surface_census.py
      - name: Enumerate learner and training-adjacent surfaces
        run: python tools/training_surface_census.py --fail-on-parse-error
      - name: Upload deterministic census
        uses: actions/upload-artifact@v4
        with:
          name: training-surface-census
          path: .training_control/training_surface_census.json
          if-no-files-found: error
