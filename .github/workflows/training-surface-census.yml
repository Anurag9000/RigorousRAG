name: Training surface census

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.ipynb"
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.zsh"
      - "**/*.ps1"
      - "**/*.r"
      - "**/*.R"
      - "**/*.jl"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-surface-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install census test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile census engines
        run: python -m py_compile tools/training_surface_census.py tools/training_surface_semantic_scan.py tests/test_training_surface_semantic_scan.py
      - name: Verify semantic census language/category behavior
        run: python -m pytest -q -o addopts='' tests/test_training_surface_semantic_scan.py
      - name: Enumerate framework learner and training-adjacent surfaces
        run: python tools/training_surface_census.py --fail-on-parse-error
      - name: Enumerate semantic learners and launch surfaces
        run: python tools/training_surface_semantic_scan.py --fail-on-parse-error
      - name: Upload deterministic census
        uses: actions/upload-artifact@v4
        with:
          name: training-surface-census
          path: |
            .training_control/training_surface_census.json
            .training_control/training_surface_semantic_scan.json
          if-no-files-found: error
