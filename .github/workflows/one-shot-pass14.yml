name: One-shot pass fourteen remediation

on:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-pass14.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-pass-fourteen-main
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply and verify pass fourteen
        id: verify
        shell: bash
        run: |
          set +e
          : > /tmp/pass14.log
          python scripts/pass14_patch.py >> /tmp/pass14.log 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            python -m compileall -q \
              tools/integrity_boundary.py tools/integrity.py tools/rag.py \
              tests/unit/test_compatibility_reload_boundaries.py \
              tests/unit/test_rag_public_boundaries.py >> /tmp/pass14.log 2>&1
            status=$?
          fi
          if [[ $status -eq 0 ]]; then
            python -m pytest \
              tests/unit/test_compatibility_reload_boundaries.py \
              tests/unit/test_integrity_direct_boundaries.py \
              tests/unit/test_integrity_extended.py \
              tests/unit/test_integrity_json_boundaries.py \
              tests/unit/test_rag_public_boundaries.py \
              tests/unit/test_rag_adversarial_boundaries.py \
              tests/unit/test_rag.py \
              --no-cov -q >> /tmp/pass14.log 2>&1
            status=$?
          fi
          cat /tmp/pass14.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
      - name: Commit verified remediation directly to main
        if: steps.verify.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "RigorousRAG Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tools/integrity_boundary.py tools/integrity.py tools/rag.py \
            tests/unit/test_compatibility_reload_boundaries.py \
            tests/unit/test_rag_public_boundaries.py
          git rm scripts/pass14_patch.py .github/workflows/one-shot-pass14.yml
          git diff --cached --check
          git commit -m "Make compatibility layers reimport-safe"
          git push origin HEAD:main
      - name: Publish bounded failure diagnostics
        if: steps.verify.outputs.status != '0'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          log = Path('/tmp/pass14.log').read_text(encoding='utf-8', errors='replace')
          diff = subprocess.run(
              [
                  'git', 'diff', '--',
                  'tools/integrity_boundary.py', 'tools/integrity.py', 'tools/rag.py',
                  'tests/unit/test_compatibility_reload_boundaries.py',
                  'tests/unit/test_rag_public_boundaries.py',
              ],
              text=True,
              capture_output=True,
          ).stdout
          Path('docs/PASS14_FAILURE.md').write_text(
              '# Pass fourteen diagnostic\n\n```text\n'
              + log[-40000:]
              + '\n```\n\n```diff\n'
              + diff[-40000:]
              + '\n```\n',
              encoding='utf-8',
          )
          PY
          git config user.name "RigorousRAG Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/PASS14_FAILURE.md
          git commit -m "Update pass fourteen verification failure" || exit 0
          git push origin HEAD:main

# Triggered after installation on the default branch.
