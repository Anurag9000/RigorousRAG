name: Exact-head verification and release locks

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: exact-head-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registration-smoke:
    name: Workflow registration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm exact checkout
        run: git rev-parse HEAD

  linux-test:
    name: Linux exact-head tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SINGLE_USER_OWNER_ID: ci-user
      ORPHAN_CLEANUP_ON_STARTUP: "false"
      ENABLE_OCR: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure isolated runtime paths
        shell: bash
        run: |
          {
            echo "CHROMA_PATH=${RUNNER_TEMP}/rigorousrag-vectors"
            echo "SPARSE_INDEX_PATH=${RUNNER_TEMP}/rigorousrag-sparse.sqlite3"
            echo "INDEX_GENERATION_DB_PATH=${RUNNER_TEMP}/rigorousrag-generations.sqlite3"
            echo "JOB_DB_PATH=${RUNNER_TEMP}/rigorousrag-jobs.sqlite3"
            echo "DOCUMENT_DB_PATH=${RUNNER_TEMP}/rigorousrag-documents.sqlite3"
            echo "UPLOAD_DIR=${RUNNER_TEMP}/rigorousrag-uploads"
            echo "CLASSIC_STORAGE_DIR=${RUNNER_TEMP}/rigorousrag-classic"
            echo "USAGE_LOG_FILE=${RUNNER_TEMP}/rigorousrag-usage.jsonl"
            echo "EVIDENCE_GRAPH_DB_PATH=${RUNNER_TEMP}/rigorousrag-evidence-graph.sqlite3"
            echo "EVIDENCE_GRAPH_JOB_DB_PATH=${RUNNER_TEMP}/rigorousrag-evidence-graph-jobs.sqlite3"
            echo "EVIDENCE_GRAPH_COMPACTION_DB_PATH=${RUNNER_TEMP}/rigorousrag-evidence-graph-compaction.sqlite3"
          } >> "${GITHUB_ENV}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            comparison_base="$(git merge-base HEAD "origin/${BASE_REF}")"
          elif [[ "${EVENT_NAME}" == "push" && -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            comparison_base="${BEFORE_SHA}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            comparison_base="HEAD^"
          else
            comparison_base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "${comparison_base}...HEAD"
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Run fatal syntax and name lint
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Validate capability audit ledger
        run: python scripts/validate_capability_ledger.py
      - name: Run tests with branch coverage
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest 2>&1 | tee pytest-${{ matrix.python-version }}.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            {
              echo "### Pytest failure tail / Python ${{ matrix.python-version }}"
              echo '```text'
              tail -n 160 pytest-${{ matrix.python-version }}.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            tail_text="$(tail -n 35 pytest-${{ matrix.python-version }}.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=pytest failure / Python ${{ matrix.python-version }}::${tail_text}"
          fi
          exit "${status}"
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 14

  windows-classic-storage:
    name: Windows classic storage / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure isolated classic-storage path
        shell: pwsh
        run: '"CLASSIC_STORAGE_DIR=$env:RUNNER_TEMP\rigorousrag-classic" >> $env:GITHUB_ENV'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile classic storage surfaces
        run: python -m compileall -q storage.py storage_legacy.py Crawler.py Indexer.py Pagerank.py Searching.py
      - name: Run Windows storage regressions
        run: >-
          python -m pytest
          tests/unit/test_classic_storage_boundaries.py
          tests/unit/test_storage.py
          tests/unit/test_storage_root_paths.py
          tests/unit/test_storage_snapshot_lock.py
          tests/unit/test_internal_search_reload.py
          --no-cov

  container:
    name: Compose and container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container
        run: docker build --tag rigorousrag:ci .

  lock:
    name: Release lock / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install compatible lock tooling
        run: >-
          python -m pip install --upgrade "pip>=25,<26"
          && python -m pip install -r requirements-lock.txt
      - name: Generate hashed platform lock
        id: lock
        run: python scripts/generate_release_lock.py --upgrade --github-output
      - name: Verify hashed lock contract
        run: python scripts/verify_release_lock.py "${{ steps.lock.outputs.path }}"
      - name: Verify install from hashes
        run: >-
          python -m pip install
          --require-hashes
          --no-deps
          --dry-run
          -r "${{ steps.lock.outputs.path }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.lock.outputs.name }}
          path: ${{ steps.lock.outputs.path }}
          if-no-files-found: error
          retention-days: 14
