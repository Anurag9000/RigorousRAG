name: Generate release locks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - scripts/generate_release_lock.py
      - scripts/verify_release_lock.py
      - .github/workflows/release-locks.yml
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lock:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lock tooling
        run: >-
          python -m pip install --upgrade pip
          "pip-tools>=7.4,<8"
          "typing-extensions>=4.12,<5"
      - name: Generate hashed platform lock
        run: python scripts/generate_release_lock.py --upgrade
      - name: Resolve lock filename
        id: lock
        shell: python
        run: |
          import os
          from scripts.generate_release_lock import default_output_path
          path = default_output_path()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"path={path.as_posix()}\n")
              handle.write(f"name={path.stem}\n")
      - name: Verify hashed lock contract
        run: python scripts/verify_release_lock.py "${{ steps.lock.outputs.path }}"
      - name: Verify install from hashes
        run: >-
          python -m pip install
          --require-hashes
          --no-deps
          --dry-run
          -r "${{ steps.lock.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lock.outputs.name }}
          path: ${{ steps.lock.outputs.path }}
          if-no-files-found: error
          retention-days: 14
