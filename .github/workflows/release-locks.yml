name: Generate release locks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - requirements-lock.txt
      - requirements-dev.txt
      - scripts/generate_release_lock.py
      - scripts/verify_release_lock.py
      - .github/workflows/release-locks.yml
      - tools/**
      - tests/**
      - server.py
      - server_app.py
      - storage.py
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux-verification:
    name: Linux exact-head verification / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SINGLE_USER_OWNER_ID: ci-user
      CHROMA_PATH: ${{ runner.temp }}/rigorousrag-vectors
      JOB_DB_PATH: ${{ runner.temp }}/rigorousrag-jobs.sqlite3
      DOCUMENT_DB_PATH: ${{ runner.temp }}/rigorousrag-documents.sqlite3
      UPLOAD_DIR: ${{ runner.temp }}/rigorousrag-uploads
      CLASSIC_STORAGE_DIR: ${{ runner.temp }}/rigorousrag-classic
      USAGE_LOG_FILE: ${{ runner.temp }}/rigorousrag-usage.jsonl
      ORPHAN_CLEANUP_ON_STARTUP: "false"
      ENABLE_OCR: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Check patch whitespace
        shell: bash
        run: git diff --check "$(git merge-base HEAD origin/${{ github.base_ref }})...HEAD"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Fatal lint checks
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Test with branch coverage
        run: python -m pytest

  lock:
    name: Runtime lock / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install compatible lock tooling
        run: >-
          python -m pip install --upgrade "pip>=25,<26"
          && python -m pip install -r requirements-lock.txt
      - name: Generate hashed platform lock
        id: lock
        run: python scripts/generate_release_lock.py --upgrade --github-output
      - name: Verify hashed lock contract
        run: python scripts/verify_release_lock.py "${{ steps.lock.outputs.path }}"
      - name: Verify install from hashes
        run: >-
          python -m pip install
          --require-hashes
          --no-deps
          --dry-run
          -r "${{ steps.lock.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lock.outputs.name }}
          path: ${{ steps.lock.outputs.path }}
          if-no-files-found: error
          retention-days: 14
