name: Evidence and calibration runtime contracts

on:
  push:
    branches: [main]
    paths:
      - 'tools/evidence_context_packing.py'
      - 'security/retrieved_content_trust.py'
      - 'tools/evidence_context_materialization.py'
      - 'evaluation/cross_profile_calibration_drift.py'
      - 'training/cross_profile_listwise_fusion.py'
      - 'tests/test_retrieved_content_trust_boundary.py'
      - 'tests/unit/test_evidence_context_packing.py'
      - 'tests/unit/test_cross_profile_calibration_drift.py'
      - 'tests/unit/test_active_learning_adapters.py'
      - 'tests/unit/test_current_cross_profile_policy.py'
      - 'tests/unit/test_cross_profile_listwise_fusion.py'
      - 'tests/unit/test_multi_region_observability.py'
      - '.github/workflows/rag-evidence-calibration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-evidence-trust-and-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile runtime and focused evidence source
        run: |
          python -m py_compile \
            tools/evidence_context_packing.py \
            security/retrieved_content_trust.py \
            tools/evidence_context_materialization.py \
            evaluation/cross_profile_calibration_drift.py \
            training/cross_profile_listwise_fusion.py
      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests
      - name: Execute runtime trust, drift, fusion and observability contracts
        run: |
          python -m pytest -q -o addopts='' \
            tests/test_retrieved_content_trust_boundary.py \
            tests/unit/test_evidence_context_packing.py \
            tests/unit/test_cross_profile_calibration_drift.py \
            tests/unit/test_active_learning_adapters.py \
            tests/unit/test_current_cross_profile_policy.py \
            tests/unit/test_cross_profile_listwise_fusion.py \
            tests/unit/test_multi_region_observability.py
