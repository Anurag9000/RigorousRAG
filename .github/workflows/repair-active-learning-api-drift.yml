name: Repair active-learning API drift

on:
  push:
    branches: [main]
    paths:
      - "scripts/repair_active_learning_api_drift.py"
      - ".github/workflows/repair-active-learning-api-drift.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-active-learning-api-drift
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Apply exact repair and run affected tests
        run: python scripts/repair_active_learning_api_drift.py
      - name: Commit verified repair directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/expert_adjudication.py orchestration/active_learning_adjudication.py tests/unit/test_active_learning.py tests/unit/test_multi_region_authority.py tests/unit/test_multi_region_authority_unit.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Repair active-learning adjudication API drift"
          git push origin HEAD:main
