name: Entity and temporal evidence contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/entity_temporal.py'
      - 'tests/unit/test_entity_temporal_source_contract.py'
      - '.github/workflows/entity-temporal-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-scoped-temporal-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source and regression tests
        run: python -m py_compile tools/entity_temporal.py tests/unit/test_entity_temporal_source_contract.py
      - name: Execute cross-owner, provider provenance and temporal-boundary tests
        run: |
          python -m pip install -q 'pytest>=8,<10' 'pytest-cov>=5,<8' 'requests>=2.31,<3'
          python -m pytest -q -o addopts='' \
            --cov=tools.entity_temporal --cov-branch --cov-report=term \
            tests/unit/test_entity_temporal_source_contract.py
