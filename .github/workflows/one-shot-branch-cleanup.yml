name: One-shot obsolete branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-branch-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches and remove this workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const obsolete = [
              'agent/exhaustive-remediation',
              'agent/exhaustive-remediation-verification',
              'agent/exhaustive-remediation-verification-2',
              'agent/exhaustive-remediation-verification-3',
              'agent/test',
            ];

            for (const branch of obsolete) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`${branch} was already absent or not deletable.`);
                  continue;
                }
                throw error;
              }
            }

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );
            const remaining = branches
              .map((branch) => branch.name)
              .filter((name) => name !== 'main');
            if (remaining.length) {
              core.setFailed(`Non-main branches remain: ${remaining.join(', ')}`);
              return;
            }

            const workflowPath = '.github/workflows/one-shot-branch-cleanup.yml';
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: workflowPath,
              ref: 'main',
            });
            if (Array.isArray(response.data) || !response.data.sha) {
              throw new Error('Could not resolve the cleanup workflow blob.');
            }
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path: workflowPath,
              message: 'chore: remove completed branch cleanup workflow',
              sha: response.data.sha,
              branch: 'main',
            });
