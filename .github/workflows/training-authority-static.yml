name: Training authority static verification

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - "tests/test_authoritative_classical_training_cli*.py"
      - "tests/test_authoritative_retrieval_training_cli*.py"
      - "config/classical_*training.example.json"
      - "config/retrieval_*training.example.json"
      - "run_all_training.py"
      - ".github/workflows/training-authority-static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-authority-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile authoritative surfaces
        run: |
          python -m py_compile \
            training/authoritative_classical_training_cli.py \
            training/authoritative_classical_training_cli_v2.py \
            training/authoritative_classical_training_cli_v3.py \
            training/authoritative_retrieval_training_cli.py \
            training/authoritative_retrieval_training_cli_v2.py \
            tests/test_authoritative_classical_training_cli.py \
            tests/test_authoritative_classical_training_cli_v3.py \
            tests/test_authoritative_retrieval_training_cli_v2.py \
            run_all_training.py

      - name: Verify pure-Python exact-resume and artifact binding
        run: |
          python -m pytest -q \
            tests/test_authoritative_classical_training_cli.py \
            tests/test_authoritative_classical_training_cli_v3.py

      - name: Verify retrieval input contract without model downloads
        run: python -m pytest -q tests/test_authoritative_retrieval_training_cli_v2.py
