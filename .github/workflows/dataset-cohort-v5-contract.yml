name: Dataset cohort v5 source integrity

on:
  push:
    branches: [main]
    paths:
      - 'training/dataset_cohort_runtime.py'
      - 'training/dataset_cohort_runtime_v4.py'
      - 'training/dataset_cohort_runtime_v5.py'
      - 'tools/dataset_cohort_runtime_entry.py'
      - 'tools/dataset_cohort_runtime_entry_v4.py'
      - 'tools/dataset_cohort_runtime_entry_v5.py'
      - 'tests/test_dataset_cohort_v3_active_entry.py'
      - 'tests/test_dataset_cohort_v4_cuda_pin.py'
      - 'tests/test_dataset_cohort_v5_git_blob_integrity.py'
      - '.github/workflows/dataset-cohort-v5-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-immutable-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile immutable historical and v5 sources
        run: |
          python -m py_compile \
            training/dataset_cohort_runtime.py \
            training/dataset_cohort_runtime_v4.py \
            training/dataset_cohort_runtime_v5.py \
            tools/dataset_cohort_runtime_entry.py \
            tools/dataset_cohort_runtime_entry_v4.py \
            tools/dataset_cohort_runtime_entry_v5.py \
            tests/test_dataset_cohort_v3_active_entry.py \
            tests/test_dataset_cohort_v4_cuda_pin.py \
            tests/test_dataset_cohort_v5_git_blob_integrity.py
      - name: Verify historic pins and v5 NUL-correct Git hash offline
        run: |
          python -m pip install --disable-pip-version-check -q pytest requests
          python -m pytest -q -o addopts='' \
            tests/test_dataset_cohort_v3_active_entry.py \
            tests/test_dataset_cohort_v4_cuda_pin.py \
            tests/test_dataset_cohort_v5_git_blob_integrity.py
