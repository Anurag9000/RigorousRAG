name: Advanced scientific statistics contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/advanced_scientific_stats.py'
      - 'tools/scientific_synthesis.py'
      - 'tests/unit/test_advanced_scientific_stats_contract.py'
      - '.github/workflows/advanced-scientific-stats-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-and-moderator-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile quantitative code and tests
        run: python -m py_compile tools/advanced_scientific_stats.py tests/unit/test_advanced_scientific_stats_contract.py
      - name: Verify meta-regression and consistency-network arithmetic
        run: |
          python -m pip install -q 'pytest>=8,<10' 'pytest-cov>=5,<8' 'requests>=2.31,<3'
          python -m pytest -q -o addopts='' \
            --cov=tools.advanced_scientific_stats --cov-branch --cov-report=term \
            tests/unit/test_advanced_scientific_stats_contract.py
