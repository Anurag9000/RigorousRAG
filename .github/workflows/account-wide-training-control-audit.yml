name: Account-wide OPF training-control certificate

on:
  push:
    branches: [main]
    paths:
      - 'tools/account_wide_training_control_audit*.py'
      - 'tools/universal_training_controller*.py'
      - 'tools/repo_training_launcher_adapter.py'
      - 'run_all_training.py'
      - '.github/workflows/account-wide-training-control-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-wide-training-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A repository-scoped GITHUB_TOKEN cannot enumerate/clone private sibling
      # repositories. TRAINING_CONTROL_GH_TOKEN must be read-only and visible to
      # the complete owner estate. The preflight deliberately refuses to treat a
      # repository-scoped token as account-wide evidence.
      GH_TOKEN: ${{ secrets.TRAINING_CONTROL_GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TRAINING_CONTROL_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile v37 estate certificate
        run: |
          python -m py_compile \
            tools/account_wide_training_control_audit.py \
            tools/account_wide_training_control_audit_v33.py \
            tools/account_wide_training_control_audit_v34.py \
            tools/account_wide_training_control_audit_v37.py

      - name: Require cross-repository audit credential
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::TRAINING_CONTROL_GH_TOKEN is required for an honest account-wide audit because the estate contains private sibling repositories. A repository-scoped github.token is intentionally not accepted as account-wide proof."
            exit 2
          fi
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"].strip()
          req = urllib.request.Request(
              "https://api.github.com/user/repos?affiliation=owner&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "training-control-estate-preflight/37",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              repos = json.load(response)
          names = {row.get("full_name") for row in repos}
          required = {
              "Anurag9000/OPF_ADP",
              "Anurag9000/RigorousRAG",
              "Anurag9000/Smart-Glasses",
              "Anurag9000/Breaking-the-Neural-Barrier",
              "Anurag9000/Railguard-AI",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"cross-repository token cannot see required estate repositories: {missing}")
          print(f"cross-repository credential preflight: visible_owned_repositories={len(names)}")
          PY

      - name: Verify canonical v37 remote estate wiring
        run: >-
          python tools/account_wide_training_control_audit_v37.py
          --remote-only
          --output .training_control/account-wide-v37-remote.json

      - name: Clone exact main heads and audit every repository
        run: >-
          python tools/account_wide_training_control_audit_v37.py
          --checkout-root "${{ runner.temp }}/training-control-estate"
          --clone-missing
          --output .training_control/account-wide-v37-local.json

      - name: Print aggregate certificate
        if: always()
        shell: bash
        run: |
          for report in .training_control/account-wide-v37-*.json; do
            if [[ -f "$report" ]]; then
              echo "===== $report ====="
              cat "$report"
            fi
          done

      - name: Upload estate certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-wide-training-control-v37-${{ github.sha }}
          path: .training_control/account-wide-v37-*.json
          if-no-files-found: warn
          retention-days: 30
