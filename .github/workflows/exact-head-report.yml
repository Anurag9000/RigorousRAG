name: Exact-head result reporter

on:
  workflow_run:
    workflows:
      - Exact-head verification and release locks
    types:
      - completed

permissions:
  contents: read

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish workflow summary
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid workflow head SHA."
            exit 1
          fi
          {
            echo "## Exact-head verification"
            echo
            echo "- Head SHA: \`${HEAD_SHA}\`"
            echo "- Source event: \`${SOURCE_EVENT}\`"
            echo "- Conclusion: \`${CONCLUSION}\`"
            echo "- Run: ${RUN_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
