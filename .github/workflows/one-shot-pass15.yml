name: One-shot pass fifteen remediation

on:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-pass15.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-pass-fifteen-main
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply and verify pass fifteen
        id: verify
        shell: bash
        run: |
          set +e
          : > /tmp/pass15.log
          python scripts/pass15_patch.py >> /tmp/pass15.log 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            python -m compileall -q \
              storage.py tools/document_store.py tools/rag.py search_agent.py \
              tests/unit/test_compatibility_reload_boundaries.py \
              tests/unit/test_document_store_root_paths.py \
              tests/unit/test_search_agent_provider_boundaries.py >> /tmp/pass15.log 2>&1
            status=$?
          fi
          if [[ $status -eq 0 ]]; then
            python -m pytest \
              tests/unit/test_compatibility_reload_boundaries.py \
              tests/unit/test_classic_storage_boundaries.py \
              tests/unit/test_storage.py \
              tests/unit/test_storage_root_paths.py \
              tests/unit/test_storage_snapshot_lock.py \
              tests/unit/test_document_store_root_paths.py \
              tests/unit/test_document_store_owner_path_binding.py \
              tests/unit/test_document_store_reconciliation.py \
              tests/unit/test_document_store_source_bytes.py \
              tests/unit/test_search_agent_provider_boundaries.py \
              tests/unit/test_search_agent_execution.py \
              tests/unit/test_search_agent_extended.py \
              tests/unit/test_rag_public_boundaries.py \
              --no-cov -q >> /tmp/pass15.log 2>&1
            status=$?
          fi
          cat /tmp/pass15.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
      - name: Commit verified remediation directly to main
        if: steps.verify.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "RigorousRAG Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            storage.py tools/document_store.py tools/rag.py search_agent.py \
            tests/unit/test_compatibility_reload_boundaries.py \
            tests/unit/test_document_store_root_paths.py \
            tests/unit/test_search_agent_provider_boundaries.py
          git rm scripts/pass15_patch.py .github/workflows/one-shot-pass15.yml
          git diff --cached --check
          git commit -m "Preserve stateful wrapper identities"
          git push origin HEAD:main
      - name: Publish bounded failure diagnostics
        if: steps.verify.outputs.status != '0'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          log = Path('/tmp/pass15.log').read_text(encoding='utf-8', errors='replace')
          diff = subprocess.run(
              [
                  'git', 'diff', '--',
                  'storage.py', 'tools/document_store.py', 'tools/rag.py', 'search_agent.py',
                  'tests/unit/test_compatibility_reload_boundaries.py',
                  'tests/unit/test_document_store_root_paths.py',
                  'tests/unit/test_search_agent_provider_boundaries.py',
              ],
              text=True,
              capture_output=True,
          ).stdout
          Path('docs/PASS15_FAILURE.md').write_text(
              '# Pass fifteen diagnostic\n\n```text\n'
              + log[-50000:]
              + '\n```\n\n```diff\n'
              + diff[-50000:]
              + '\n```\n',
              encoding='utf-8',
          )
          PY
          git config user.name "RigorousRAG Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/PASS15_FAILURE.md
          git commit -m "Update pass fifteen verification failure" || exit 0
          git push origin HEAD:main
