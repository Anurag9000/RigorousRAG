name: training-control-static

on:
  push:
    branches: [main]
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/repo_training_launcher_adapter.py'
      - 'tools/training_surface_census.py'
      - 'tools/training_surface_semantic_scan.py'
      - 'tools/account_wide_training_control_audit*.py'
      - 'tests/test_training_controller*.py'
      - 'tests/test_universal_cuda_backend_bundle_v39.py'
      - 'tests/test_universal_cuda_backend_bundle_v40.py'
      - 'controller_bundle_v40/*.py'
      - 'controller_bundle_v41/*.py'
      - 'tests/test_universal_cuda_backend_bundle_v41.py'
      - 'tests/test_training_surface_semantic_scan.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  pull_request:
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/repo_training_launcher_adapter.py'
      - 'tools/training_surface_census.py'
      - 'tools/training_surface_semantic_scan.py'
      - 'tools/account_wide_training_control_audit*.py'
      - 'tests/test_training_controller*.py'
      - 'tests/test_universal_cuda_backend_bundle_v39.py'
      - 'tests/test_universal_cuda_backend_bundle_v40.py'
      - 'controller_bundle_v40/*.py'
      - 'controller_bundle_v41/*.py'
      - 'tests/test_universal_cuda_backend_bundle_v41.py'
      - 'tests/test_training_surface_semantic_scan.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  workflow_dispatch:

jobs:
  compile-and-static-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile controller sources
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          paths = sorted({
              *Path('tools').glob('universal_training_controller*.py'),
              Path('tools/repo_training_launcher_adapter.py'),
              Path('tools/training_surface_census.py'),
              Path('tools/training_surface_semantic_scan.py'),
              *Path('tools').glob('account_wide_training_control_audit*.py'),
              Path('run_all_training.py'),
          })
          missing = [str(path) for path in paths if not path.is_file()]
          if missing:
              raise SystemExit(f'missing controller sources: {missing}')
          for path in paths:
              py_compile.compile(str(path), doraise=True)
          print(f'compiled {len(paths)} controller/audit sources')
          PY

      - name: Compile immutable v40 candidate and OPF overlay
        run: |
          python -m py_compile \
            tools/universal_training_controller_entry_v40.py \
            tools/universal_training_controller_entry_v40_bundle.py \
            controller_bundle_v40/universal_training_controller_opf_reference_v2.py \
            tests/test_universal_cuda_backend_bundle_v39.py \
            tests/test_universal_cuda_backend_bundle_v40.py \
            tests/test_universal_cuda_backend_bundle_v41.py

      - name: Verify active v39 and staged v40 sources without network
        run: |
          python -m pip install --disable-pip-version-check -q pytest psutil
          python -m pytest -q -o addopts='' \
            tests/test_universal_cuda_backend_bundle_v39.py \
            tests/test_universal_cuda_backend_bundle_v40.py \
            tests/test_universal_cuda_backend_bundle_v41.py

      - name: Compile staged v41 source and reference
        run: |
          python -m py_compile \
            tools/universal_training_controller_entry_v41.py \
            tools/universal_training_controller_entry_v41_bundle.py \
            controller_bundle_v41/universal_training_controller_opf_reference_v2.py \
            tests/test_universal_cuda_backend_bundle_v41.py

      - name: Exercise active v41 cold bootstrap without external OPF access
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry.py --training-control-bootstrap-self-test \
            > "$tmp/v41-bootstrap-result.json"
          python - "$tmp/v41-bootstrap-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result["status"] == "ok", result
          assert result["bundle"] == "v41", result
          assert result["controller_files"] == 60, result
          assert result["opf_files"] == 9, result
          assert result["opf_commit"] == "a361b49ac24ffc7de87440538c88994faed017c4", result
          print("staged v41 cold-bootstrap manifest verified")
          PY

      - name: Exercise archived v39 cold bootstrap in an empty repository root
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry_v39.py --training-control-bootstrap-self-test

      - name: Exercise archived v40 cold bootstrap with pinned OPF reference
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry_v40.py --training-control-bootstrap-self-test \
            > "$tmp/v40-bootstrap-result.json"
          cat "$tmp/v40-bootstrap-result.json"
          python - "$tmp/v40-bootstrap-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result["status"] == "ok", result
          assert result["bundle"] == "v40", result
          assert result["controller_files"] == 60, result
          assert result["opf_files"] == 9, result
          assert result["opf_commit"] == "d3687061296a4cfc063bce149096dcc1d973716b", result
          print("staged v40 cold-bootstrap manifest verified")
          PY

      - name: Run public controller safety tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest psutil
          python -m pytest -q -o addopts='' \
            tests/test_training_controller_console_registry.py \
            tests/test_training_controller_deferred_expansion.py \
            tests/test_training_controller_entry_diagnostics.py \
            tests/test_training_controller_exact_resume.py \
            tests/test_training_controller_inventory_scope.py \
            tests/test_training_controller_audit_infrastructure.py \
            tests/test_training_controller_semantic_inventory.py \
            tests/test_training_controller_opf_mechanism_audit_offline.py \
            tests/test_training_controller_opf_reference_v20.py \
            tests/test_training_surface_semantic_scan.py
