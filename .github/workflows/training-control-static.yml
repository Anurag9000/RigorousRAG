name: training-control-static

on:
  push:
    branches: [main]
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/repo_training_launcher_adapter.py'
      - 'tools/training_surface_census.py'
      - 'tools/training_surface_semantic_scan.py'
      - 'tools/training_surface_semantic_scan_legacy_v20.py'
      - 'tools/account_wide_training_control_audit*.py'
      - 'tests/test_training_controller*.py'
      - 'tests/test_training_surface_semantic_scan.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  pull_request:
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/repo_training_launcher_adapter.py'
      - 'tools/training_surface_census.py'
      - 'tools/training_surface_semantic_scan.py'
      - 'tools/training_surface_semantic_scan_legacy_v20.py'
      - 'tools/account_wide_training_control_audit*.py'
      - 'tests/test_training_controller*.py'
      - 'tests/test_training_surface_semantic_scan.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  workflow_dispatch:

jobs:
  compile-and-static-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile controller sources
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          paths = sorted({
              *Path('tools').glob('universal_training_controller*.py'),
              Path('tools/repo_training_launcher_adapter.py'),
              Path('tools/training_surface_census.py'),
              Path('tools/training_surface_semantic_scan.py'),
              Path('tools/training_surface_semantic_scan_legacy_v20.py'),
              *Path('tools').glob('account_wide_training_control_audit*.py'),
              Path('run_all_training.py'),
          })
          missing = [str(path) for path in paths if not path.is_file()]
          if missing:
              raise SystemExit(f'missing controller sources: {missing}')
          for path in paths:
              py_compile.compile(str(path), doraise=True)
          print(f'compiled {len(paths)} controller/audit sources')
          PY

      - name: Check v35 compatibility and literal-OPF composition invariants
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import run_all_training as runner

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f"blob {len(data)}\0".encode('ascii') + data).hexdigest()

          entry = Path('tools/universal_training_controller_entry.py').read_text(encoding='utf-8')
          required_entry = (
              'v35',
              '142587b31ea4097e237cbe4ad756bb595c1591f7',
              '0c7c6307ca97fbc502b511f845059f345712fc7d',
              '26c833284c2be2e80af149b1a2d8902b1a5b43ee',
              'd6185607102353f8d18b993427065832f3fb374b',
              '2b39c1fb680e608424ba77ed0f7245b0a558f256',
              'training_surface_semantic_scan_legacy_v20.py',
              '_preseed_legacy_semantic_scanner',
              '_load_v34_bootstrap',
          )
          for value in required_entry:
              assert value in entry, value
          for forbidden in ('resolve_concurrency(', 'resolve_launch_capacity(', 'select_launch_device(', 'nvidia-smi'):
              assert forbidden not in entry, f'v35 must not reimplement scheduler mechanism {forbidden}'

          helper = Path('tools/training_surface_semantic_scan_legacy_v20.py').read_bytes()
          assert blob_sha(helper) == 'd6185607102353f8d18b993427065832f3fb374b'

          adapter = Path('tools/repo_training_launcher_adapter.py').read_text(encoding='utf-8')
          assert '1114e757e30085250889091b50bea3c549ba0c84' in adapter
          assert 'af5402584d7873e9a54f7f6bde79aa45461d4ccc' in adapter
          assert 'NEW_CONTROLLER_URL' in adapter

          assert runner.CONTROLLER == runner.ROOT / 'tools' / 'universal_training_controller_entry.py'
          assert runner.CATALOG == 'training/authoritative_training_suite_catalog.py'
          for gate in (
              'strict_coverage',
              'require_training_exact_resume',
              'require_training_early_stopping',
              'require_dag_enforcement',
              'require_source_proven_training_exact_resume',
              'require_source_proven_training_early_stopping',
              'require_all_retained_trainable_source_reachability',
              'require_literal_opf_mechanism_parity',
          ):
              assert runner.PROFILE.get(gate) is True, gate

          # The v35 layer is intentionally only a cache-compatibility shim; v34
          # remains the scientific/source closure layer and the immutable v20
          # ancestry remains the sole literal OPF scheduler loader.
          print('v35 compatibility/static controller invariants passed')
          PY

      - name: Run public controller safety tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest psutil
          python -m pytest -q -o addopts='' \
            tests/test_training_controller_console_registry.py \
            tests/test_training_controller_deferred_expansion.py \
            tests/test_training_controller_entry_diagnostics.py \
            tests/test_training_controller_exact_resume.py \
            tests/test_training_controller_inventory_scope.py \
            tests/test_training_controller_audit_infrastructure.py \
            tests/test_training_controller_semantic_inventory.py \
            tests/test_training_controller_opf_mechanism_audit_offline.py \
            tests/test_training_controller_opf_reference_v20.py \
            tests/test_training_surface_semantic_scan.py
