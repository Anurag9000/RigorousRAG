name: training-control-static

on:
  push:
    branches: [main]
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/repo_training_launcher_adapter.py'
      - 'tools/training_surface_census.py'
      - 'tools/training_surface_semantic_scan.py'
      - 'tools/account_wide_training_control_audit*.py'
      - 'tests/test_training_controller*.py'
      - 'tests/test_universal_cuda_backend_bundle_v39.py'
      - 'tests/test_universal_cuda_backend_bundle_v40.py'
      - 'controller_bundle_v40/*.py'
      - 'controller_bundle_v41/*.py'
      - 'controller_bundle_v42/*.py'
      - 'controller_bundle_v43/*.py'
      - 'controller_bundle_v44/*.py'
      - 'tests/test_universal_cuda_backend_bundle_v41.py'
      - 'tests/test_universal_training_controller_bundle_v42.py'
      - 'tests/test_universal_training_controller_bundle_v43.py'
      - 'tests/test_universal_training_controller_bundle_v44.py'
      - 'controller_bundle_v44/*.py'
      - 'tests/test_training_surface_semantic_scan.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  pull_request:
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/repo_training_launcher_adapter.py'
      - 'tools/training_surface_census.py'
      - 'tools/training_surface_semantic_scan.py'
      - 'tools/account_wide_training_control_audit*.py'
      - 'tests/test_training_controller*.py'
      - 'tests/test_universal_cuda_backend_bundle_v39.py'
      - 'tests/test_universal_cuda_backend_bundle_v40.py'
      - 'controller_bundle_v40/*.py'
      - 'controller_bundle_v41/*.py'
      - 'controller_bundle_v42/*.py'
      - 'controller_bundle_v43/*.py'
      - 'controller_bundle_v44/*.py'
      - 'tests/test_universal_cuda_backend_bundle_v41.py'
      - 'tests/test_universal_training_controller_bundle_v42.py'
      - 'tests/test_universal_training_controller_bundle_v43.py'
      - 'tests/test_universal_training_controller_bundle_v44.py'
      - 'controller_bundle_v44/*.py'
      - 'tests/test_training_surface_semantic_scan.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  workflow_dispatch:

jobs:
  compile-and-static-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile controller sources
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          paths = sorted({
              *Path('tools').glob('universal_training_controller*.py'),
              Path('tools/repo_training_launcher_adapter.py'),
              Path('tools/training_surface_census.py'),
              Path('tools/training_surface_semantic_scan.py'),
              *Path('tools').glob('account_wide_training_control_audit*.py'),
              Path('run_all_training.py'),
          })
          missing = [str(path) for path in paths if not path.is_file()]
          if missing:
              raise SystemExit(f'missing controller sources: {missing}')
          for path in paths:
              py_compile.compile(str(path), doraise=True)
          print(f'compiled {len(paths)} controller/audit sources')
          PY

      - name: Compile immutable v40 candidate and OPF overlay
        run: |
          python -m py_compile \
            tools/universal_training_controller_entry_v40.py \
            tools/universal_training_controller_entry_v40_bundle.py \
            controller_bundle_v40/universal_training_controller_opf_reference_v2.py \
            tests/test_universal_cuda_backend_bundle_v39.py \
            tests/test_universal_cuda_backend_bundle_v40.py \
            tests/test_universal_cuda_backend_bundle_v41.py

      - name: Verify active v39 and staged v40 sources without network
        run: |
          python -m pip install --disable-pip-version-check -q pytest psutil
          python -m pytest -q -o addopts='' \
            tests/test_universal_cuda_backend_bundle_v39.py \
            tests/test_universal_cuda_backend_bundle_v40.py \
            tests/test_universal_cuda_backend_bundle_v41.py

      - name: Verify pinned private OPF cache and error contracts offline
        run: |
          python -m pytest -q -o addopts='' \
            tests/test_training_controller_literal_opf_private_cache_contract.py

      - name: Compile staged v41 source and reference
        run: |
          python -m py_compile \
            tools/universal_training_controller_entry_v41.py \
            tools/universal_training_controller_entry_v41_bundle.py \
            controller_bundle_v41/universal_training_controller_opf_reference_v2.py \
            tests/test_universal_cuda_backend_bundle_v41.py

      - name: Exercise active v41 cold bootstrap without external OPF access
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry.py --training-control-bootstrap-self-test \
            > "$tmp/v41-bootstrap-result.json"
          python - "$tmp/v41-bootstrap-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result["status"] == "ok", result
          assert result["bundle"] == "v41", result
          assert result["controller_files"] == 60, result
          assert result["opf_files"] == 9, result
          assert result["opf_commit"] == "a361b49ac24ffc7de87440538c88994faed017c4", result
          print("staged v41 cold-bootstrap manifest verified")
          PY

      - name: Compile and verify staged v42 controller overlays
        run: |
          python -m py_compile \
            tools/universal_training_controller_entry_v42.py \
            tools/universal_training_controller_entry_v42_bundle.py \
            controller_bundle_v42/universal_training_controller_job_catalog_v2.py \
            controller_bundle_v42/universal_training_controller_workload_closure.py \
            controller_bundle_v42/universal_training_controller_scientific_surface_v25.py \
            controller_bundle_v42/universal_training_controller_selector_closure_v26.py \
            controller_bundle_v42/universal_training_controller_declaration_closure_v30.py \
            controller_bundle_v42/universal_training_controller_opf_reference_v2.py \
            tests/test_universal_training_controller_bundle_v42.py \
            tests/test_training_controller_scanner_scope_v42.py \
            tests/test_training_controller_job_catalog_import_scope_v42.py
          python -m pytest -q -o addopts='' \
            tests/test_universal_training_controller_bundle_v42.py \
            tests/test_training_controller_scanner_scope_v42.py \
            tests/test_training_controller_job_catalog_import_scope_v42.py

      - name: Exercise staged v42 cold bootstrap
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry_v42.py --training-control-bootstrap-self-test \
            > "$tmp/v42-bootstrap-result.json"
          python - "$tmp/v42-bootstrap-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result["status"] == "ok", result
          assert result["bundle"] == "v42", result
          assert result["controller_files"] == 60, result
          assert result["opf_files"] == 9, result
          assert result["opf_commit"] == "a361b49ac24ffc7de87440538c88994faed017c4", result
          print("staged v42 cold-bootstrap manifest verified")
          PY

      - name: Compile and verify staged v43 OPF compatibility release
        run: |
          python -m py_compile \
            tools/universal_training_controller_entry_v43.py \
            tools/universal_training_controller_entry_v43_bundle.py \
            controller_bundle_v43/universal_training_controller_opf_reference_v2.py \
            tests/test_universal_training_controller_bundle_v43.py
          python -m pytest -q -o addopts='' \
            tests/test_universal_training_controller_bundle_v43.py

      - name: Exercise staged v43 cold bootstrap
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry_v43.py --training-control-bootstrap-self-test \
            > "$tmp/v43-bootstrap-result.json"
          python - "$tmp/v43-bootstrap-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result["status"] == "ok", result
          assert result["bundle"] == "v43", result
          assert result["controller_files"] == 60, result
          assert result["opf_files"] == 10, result
          assert result["opf_commit"] == "d6cb36ae9c526b5d2c7d7869e7d0cb380584b0c2", result
          print("staged v43 cold-bootstrap manifest verified")
          PY

      - name: Compile and verify staged v44 OPF loader-admission release
        run: |
          python -m py_compile \
            tools/universal_training_controller_entry_v44.py \
            tools/universal_training_controller_entry_v44_bundle.py \
            controller_bundle_v44/universal_training_controller_opf_reference_v2.py \
            tests/test_universal_training_controller_bundle_v44.py
          python -m pytest -q -o addopts='' \
            tests/test_universal_training_controller_bundle_v44.py

      - name: Exercise staged v44 cold bootstrap
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry_v44.py --training-control-bootstrap-self-test \
            > "$tmp/v44-bootstrap-result.json"
          python - "$tmp/v44-bootstrap-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result["status"] == "ok", result
          assert result["bundle"] == "v44", result
          assert result["controller_files"] == 60, result
          assert result["opf_files"] == 10, result
          assert result["opf_commit"] == "3d27019c17b2e8a48ef03068535d5ed5fdadca03", result
          print("staged v44 cold-bootstrap manifest verified")
          PY

      - name: Audit live RigorousRAG profile through staged v42
        run: |
          profile="$(python - <<'PY'
          import json
          import run_all_training
          print(json.dumps(run_all_training.PROFILE, separators=(',', ':'), sort_keys=True))
          PY
          )"
          set +e
          TRAINING_CONTROL_PROFILE="$profile" \
          TRAINING_CONTROL_REPO_ROOT="$PWD" \
            python tools/universal_training_controller_entry_v42.py --training-control-audit \
            > /tmp/v42-training-control-audit.stdout
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.training_control/coverage_report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          keys = (
              'coverage_ok',
              'strict_workload_surface_pass',
              'strict_dynamic_scientific_registry_pass',
              'strict_registry_member_pass',
              'strict_declarative_scientific_source_pass',
              'strict_semantic_training_surface_pass',
              'strict_retained_training_closure_pass',
          )
          summary = {key: report.get(key) for key in keys}
          for key in (
              'unaccounted_workload_registry_paths',
              'unaccounted_training_config_paths',
              'unaccounted_dynamic_scientific_registries',
              'unaccounted_semantic_learner_surfaces',
              'unreachable_retained_trainable_sources',
          ):
              value = report.get(key) or []
              summary[key + '_count'] = len(value)
              summary[key + '_sample'] = value[:20]
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          exit "$status"

      - name: Upload staged v42 training-control certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-v42-training-control-${{ github.sha }}
          path: .training_control/coverage_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Exercise archived v39 cold bootstrap in an empty repository root
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry_v39.py --training-control-bootstrap-self-test

      - name: Exercise archived v40 cold bootstrap with pinned OPF reference
        run: |
          tmp="$(mktemp -d)"
          TRAINING_CONTROL_REPO_ROOT="$tmp" \
            python tools/universal_training_controller_entry_v40.py --training-control-bootstrap-self-test \
            > "$tmp/v40-bootstrap-result.json"
          cat "$tmp/v40-bootstrap-result.json"
          python - "$tmp/v40-bootstrap-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result["status"] == "ok", result
          assert result["bundle"] == "v40", result
          assert result["controller_files"] == 60, result
          assert result["opf_files"] == 9, result
          assert result["opf_commit"] == "d3687061296a4cfc063bce149096dcc1d973716b", result
          print("staged v40 cold-bootstrap manifest verified")
          PY

      - name: Run public controller safety tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest psutil
          python -m pytest -q -o addopts='' \
            tests/test_training_controller_console_registry.py \
            tests/test_training_controller_deferred_expansion.py \
            tests/test_training_controller_entry_diagnostics.py \
            tests/test_training_controller_exact_resume.py \
            tests/test_training_controller_inventory_scope.py \
            tests/test_training_controller_audit_infrastructure.py \
            tests/test_training_controller_semantic_inventory.py \
            tests/test_training_controller_opf_mechanism_audit_offline.py \
            tests/test_training_controller_opf_reference_v20.py \
            tests/test_training_surface_semantic_scan.py \
            tests/test_training_controller_scanner_scope_v42.py \
            tests/test_training_controller_job_catalog_import_scope_v42.py
