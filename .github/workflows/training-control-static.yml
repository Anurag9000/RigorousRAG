name: training-control-static

on:
  push:
    branches: [main]
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/account_wide_training_control_audit.py'
      - 'tests/test_training_controller_deferred_expansion.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  pull_request:
    paths:
      - 'tools/universal_training_controller*.py'
      - 'tools/account_wide_training_control_audit.py'
      - 'tests/test_training_controller_deferred_expansion.py'
      - 'run_all_training.py'
      - '.github/workflows/training-control-static.yml'
  workflow_dispatch:

jobs:
  compile-and-static-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile controller sources
        run: |
          python -m py_compile \
            tools/universal_training_controller.py \
            tools/universal_training_controller_current.py \
            tools/universal_training_controller_dag.py \
            tools/universal_training_controller_exact_resume.py \
            tools/universal_training_controller_console.py \
            tools/universal_training_controller_console_defaults.py \
            tools/universal_training_controller_subcommands.py \
            tools/universal_training_controller_restart_exact.py \
            tools/universal_training_controller_opf_grace.py \
            tools/universal_training_controller_registry_scheduling.py \
            tools/universal_training_controller_training_contracts.py \
            tools/universal_training_controller_profile_file.py \
            tools/universal_training_controller_job_catalog_v2.py \
            tools/universal_training_controller_large_catalog.py \
            tools/universal_training_controller_opf_mechanism_audit.py \
            tools/universal_training_controller_deferred.py \
            tools/universal_training_controller_deferred_v2.py \
            tools/universal_training_controller_deferred_v3.py \
            tools/universal_training_controller_deferred_v4.py \
            tools/universal_training_controller_v18.py \
            tools/universal_training_controller_v19.py \
            tools/universal_training_controller_entry.py \
            tools/account_wide_training_control_audit.py \
            run_all_training.py
      - name: Check literal-OPF and v19 composition invariants
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          entry = Path('tools/universal_training_controller_entry.py').read_text()
          for required in (
              'a34c31259bd5d5f58081e3766918f9df63017455',
              'b97d47499c83bc6ed3a5753f7f3009b624c94868',
              '3637b9f084d053e61ea773aae5e90770ddfe8246',
              '6dc85929f749cc1d5202d3481509e6db9b6aeb67',
              '13ce80ca3465250565e54b0d59ae21adb8613808',
              'universal_training_controller_v19.py',
          ):
              assert required in entry, required

          tree = ast.parse(Path('tools/universal_training_controller_dag.py').read_text())
          assignments = set()
          for node in ast.walk(tree):
              targets = []
              if isinstance(node, ast.Assign):
                  targets = list(node.targets)
              elif isinstance(node, (ast.AnnAssign, ast.AugAssign)):
                  targets = [node.target]
              for target in targets:
                  if isinstance(target, ast.Attribute) and isinstance(target.value, ast.Name) and target.value.id == 'opf':
                      assignments.add(target.attr)
          assert assignments <= {'build_suite_jobs'}, assignments

          v19 = Path('tools/universal_training_controller_v19.py').read_text()
          for required in (
              'exact_resume.install()',
              'large_catalog.install()',
              'restart_exact.install()',
              'opf_grace.install()',
              'training_contracts.install()',
              'mechanism_audit.install()',
              'return deferred.main()',
              'universal_training_controller_deferred_v4 as deferred',
          ):
              assert required in v19, required

          rooted = Path('tools/universal_training_controller_deferred_v4.py').read_text()
          for required in ('os.chdir(resolved_root)', 'finally:', 'os.chdir(original_cwd)', 'return strict.main()'):
              assert required in rooted, required
          print('static immutable v19 controller invariants passed')
          PY
      - name: Run deferred expansion safety tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q -o addopts='' tests/test_training_controller_deferred_expansion.py
