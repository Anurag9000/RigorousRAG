name: One-shot pass ten remediation

on:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-pass10.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply exact-anchor patches
        run: python scripts/pass10_patch.py
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile patched modules
        run: python -m compileall -q tools/operator_repair.py server.py trusted_sources.py tests/unit/test_operator_repair.py tests/unit/test_server_configuration.py tests/unit/test_trusted_sources_boundaries.py
      - name: Run focused regressions
        run: >-
          python -m pytest
          tests/unit/test_operator_repair.py
          tests/unit/test_operator_repair_scan.py
          tests/unit/test_server_configuration.py
          tests/unit/test_trusted_sources_boundaries.py
          --no-cov -q
      - name: Commit verified remediation directly to main
        shell: bash
        run: |
          git config user.name "RigorousRAG Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add tools/operator_repair.py server.py trusted_sources.py \
            tests/unit/test_operator_repair.py \
            tests/unit/test_server_configuration.py \
            tests/unit/test_trusted_sources_boundaries.py
          git rm scripts/pass10_patch.py .github/workflows/one-shot-pass10.yml
          git diff --cached --check
          git commit -m "Harden operator audit and trusted service paths"
          git push origin HEAD:main
