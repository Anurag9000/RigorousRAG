name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
      SINGLE_USER_OWNER_ID: ci-user
      CHROMA_PATH: ${{ github.workspace }}/.ci-rag-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag rigorousrag:ci .
