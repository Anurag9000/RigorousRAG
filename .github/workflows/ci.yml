name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SINGLE_USER_OWNER_ID: ci-user
      CHROMA_PATH: ${{ runner.temp }}/rigorousrag-vectors
      JOB_DB_PATH: ${{ runner.temp }}/rigorousrag-jobs.sqlite3
      DOCUMENT_DB_PATH: ${{ runner.temp }}/rigorousrag-documents.sqlite3
      UPLOAD_DIR: ${{ runner.temp }}/rigorousrag-uploads
      USAGE_LOG_FILE: ${{ runner.temp }}/rigorousrag-usage.jsonl
      ORPHAN_CLEANUP_ON_STARTUP: "false"
      ENABLE_OCR: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Fatal lint checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Test with coverage
        run: pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag rigorousrag:ci .
