[project]
name = "rigorousrag"
version = "4.0.0"
description = "Evidence-oriented academic search and owner-scoped document RAG"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
readme = "README.md"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers --cov=. --cov-report=term-missing --cov-fail-under=50"
testpaths = ["tests"]
markers = [
  "integration: tests crossing module or service boundaries",
  "network: tests requiring explicitly enabled external networking",
]
filterwarnings = [
  "error::RuntimeWarning",
  "ignore::DeprecationWarning:chromadb.*",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["data", "rag_storage", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = "^(data|rag_storage|uploads)/"
