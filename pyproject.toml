[project]
name = "rigorousrag"
version = "4.4.0"
description = "Evidence-oriented academic search and owner-scoped document RAG"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
rigorousrag-advanced-training = "training.authoritative_advanced_training_cli:main"
rigorousrag-advanced-release = "training.authoritative_advanced_release_operator_v5:main"
rigorousrag-grounded-import = "training.scalable_authoritative_grounded_import_cli:main"
rigorousrag-dynamic-publish = "training.dynamic_dataset_publication_cli:main"
rigorousrag-dynamic-sidecar = "training.sqlite_dynamic_supervision_sidecar_cli:main"
rigorousrag-dynamic-feature-sidecar = "orchestration.dynamic_feature_observation_sidecar_cli:main"
rigorousrag-dynamic-recordings = "training.recorded_dynamic_cohort_cli:main"
rigorousrag-canonical-materialize = "training.authoritative_canonical_materialization_cli:main"
rigorousrag-canonical-bundle = "training.authoritative_canonical_bundle_cli:main"
rigorousrag-canonical-recipe = "training.authoritative_canonical_recipe_v2_cli:main"
rigorousrag-benchmark-import = "evaluation.scalable_authoritative_benchmark_import_cli:main"
rigorousrag-benchmark-qualify = "evaluation.authoritative_benchmark_qualification_cli:main"
rigorousrag-benchmark-result = "evaluation.production_benchmark_result_cli:main"
rigorousrag-corpus-import = "evaluation.scalable_authoritative_corpus_import_cli:main"
rigorousrag-evaluator-contract = "evaluation.strict_production_evaluator_contract_cli:main"
rigorousrag-qrels = "evaluation.scalable_governed_qrels_cli:main"
rigorousrag-retrieval-benchmark = "evaluation.authoritative_governed_retrieval_cli:main"
rigorousrag-runtime-bundle = "orchestration.authoritative_advanced_runtime_bundle_cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers --cov=. --cov-report=term-missing --cov-fail-under=50"
testpaths = ["tests"]
markers = [
  "integration: tests crossing module or service boundaries",
  "network: tests requiring explicitly enabled external networking",
]
filterwarnings = [
  "error::RuntimeWarning",
  "ignore::DeprecationWarning:chromadb.*",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["data", "rag_storage", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = "^(data|rag_storage|uploads)/"
